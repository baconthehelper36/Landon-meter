<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080b12;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        /* =========================
           LOADING SCREEN
        ========================= */

        #loadingScreen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center, #182238 0%, #080b12 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .loadingBox {
            width: min(420px, 85%);
            text-align: center;
        }

        .loadingTitle {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(255,255,255,0.12);
            border-top-color: #61a8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        .loadingText {
            margin-top: 22px;
            color: #aebbd0;
            font-size: 15px;
        }

        .progress {
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progressBar {
            height: 100%;
            width: 0%;
            background: #61a8ff;
            transition: width 0.2s linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loginCard {
            width: min(400px, 100%);
            background: rgba(18, 23, 35, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
        }

        .loginCard h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .loginCard p {
            color: #8e9bb0;
            margin-bottom: 28px;
        }

        .inputGroup {
            margin-bottom: 16px;
        }

        .inputGroup label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #b8c3d5;
        }

        .inputGroup input {
            width: 100%;
            padding: 13px 14px;
            background: #0c1019;
            border: 1px solid #273044;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .inputGroup input:focus {
            border-color: #61a8ff;
        }

        .loginButton {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #61a8ff;
            color: #06101e;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .loginButton:hover {
            filter: brightness(1.08);
        }

        .loginError {
            color: #ff7777;
            font-size: 14px;
            margin-top: 14px;
            display: none;
        }

        /* =========================
           DASHBOARD
        ========================= */

        #dashboard {
            display: none;
            min-height: 100vh;
        }

        .topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(8,11,18,0.85);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .greeting {
            font-size: 20px;
            font-weight: 600;
        }

        .topRight {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .languageSelect {
            background: #111827;
            color: white;
            border: 1px solid #29344a;
            padding: 9px 12px;
            border-radius: 9px;
            outline: none;
            cursor: pointer;
        }

        .logoutButton {
            background: transparent;
            color: #aebbd0;
            border: 1px solid #29344a;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
        }

        .logoutButton:hover {
            color: white;
            border-color: #61a8ff;
        }

        .dashboardContent {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .dashboardCenter {
            text-align: center;
            width: min(700px, 100%);
        }

        .dashboardCenter h2 {
            font-size: 30px;
            margin-bottom: 35px;
        }

        .dashboardButtons {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .dashboardButton {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background:
                radial-gradient(circle at 35% 25%, #243552, #111827 55%, #0b0f18);
            color: white;
            cursor: pointer;
            box-shadow: 0 20px 55px rgba(0,0,0,0.35);
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .dashboardButton:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #61a8ff;
        }

        .buttonIcon {
            display: block;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .buttonTitle {
            font-size: 22px;
            font-weight: 700;
        }

        .buttonSub {
            color: #8e9bb0;
            margin-top: 7px;
            font-size: 13px;
        }

        .unreadBadge {
            position: absolute;
            margin-left: 140px;
            margin-top: -200px;
            background: #ff5555;
            color: white;
            min-width: 27px;
            height: 27px;
            padding: 0 7px;
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================
           SYSTEM TEST PANEL
        ========================= */

        .systemPanel {
            display: none;
            margin: 30px auto 0;
            width: min(650px, 100%);
            background: #101621;
            border: 1px solid rgba(97,168,255,0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }

        .systemPanel h3 {
            margin-bottom: 7px;
            font-size: 18px;
        }

        .systemPanel p {
            color: #8996aa;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .testButtons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .testButton {
            background: #1d2d44;
            border: 1px solid #304967;
            color: white;
            padding: 10px 15px;
            border-radius: 9px;
            cursor: pointer;
        }

        .testButton:hover {
            background: #294565;
        }

        .testStatus {
            margin-top: 12px;
            color: #8fa1ba;
            font-size: 13px;
        }

        /* =========================
           MODALS
        ========================= */

        .modalOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 500;
        }

        .modal {
            width: min(650px, 100%);
            max-height: 85vh;
            background: #101621;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .modalHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .modalHeader h2 {
            font-size: 21px;
        }

        .closeButton {
            border: none;
            background: transparent;
            color: #8e9bb0;
            font-size: 25px;
            cursor: pointer;
        }

        .closeButton:hover {
            color: white;
        }

        /* =========================
           INBOX
        ========================= */

        .notifications {
            overflow-y: auto;
            padding: 15px;
        }

        .notification {
            background: #151c29;
            border: 1px solid #222d40;
            border-radius: 13px;
            padding: 17px;
            margin-bottom: 12px;
        }

        .notification.unread {
            border-color: #38577f;
        }

        .notificationTop {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 8px;
        }

        .notificationTitle {
            font-weight: 700;
        }

        .notificationSender {
            color: #61a8ff;
            font-size: 13px;
        }

        .notificationMessage {
            color: #b4bfd0;
            line-height: 1.5;
            font-size: 14px;
        }

        .notificationTime {
            color: #68758a;
            font-size: 12px;
            margin-top: 12px;
        }

        .notificationActions {
            margin-top: 13px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .readButton,
        .answerButton,
        .submitFoodButton {
            background: #202c40;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .answerButton {
            min-width: 70px;
            background: #263b58;
        }

        .answerButton:hover,
        .readButton:hover,
        .submitFoodButton:hover {
            background: #345477;
        }

        .foodAnswerArea {
            margin-top: 14px;
            display: none;
        }

        .foodAnswerArea input {
            width: 100%;
            padding: 11px 12px;
            background: #0c1019;
            border: 1px solid #29344a;
            border-radius: 9px;
            color: white;
            outline: none;
        }

        .foodAnswerArea input:focus {
            border-color: #61a8ff;
        }

        .foodAnswerArea button {
            margin-top: 8px;
        }

        .answerStatus {
            margin-top: 13px;
            color: #9eabc0;
            font-size: 13px;
        }

        .emptyState {
            padding: 45px 20px;
            text-align: center;
            color: #7f8ba0;
        }

        /* =========================
           AI ASSISTANT
        ========================= */

        .aiModal {
            width: min(850px, 100%);
            height: min(750px, 88vh);
        }

        .chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .chatMessage {
            display: flex;
            margin-bottom: 15px;
        }

        .chatMessage.user {
            justify-content: flex-end;
        }

        .chatBubble {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chatMessage.assistant .chatBubble {
            background: #192335;
            color: #e8edf5;
            border-bottom-left-radius: 4px;
        }
