        const VAPID_PUBLIC_KEY =

        function urlBase64ToUint8Array(
            base64String
        ) {

            const padding =
                "=".repeat(
                    (4 -
                        base64String.length %
                        4) %
                    4
                );


            const base64 =
                (
                    base64String +
                    padding
                )
                    .replace(
                        /-/g,
                        "+"
                    )
                    .replace(
                        /_/g,
                        "/"
                    );


            const rawData =
                window.atob(
                    base64
                );


            return Uint8Array.from(
                [...rawData].map(
                    char =>
                        char.charCodeAt(0)
                )
            );

        async function setupPushNotifications() {

            if (
                !("serviceWorker" in navigator) ||
                !("PushManager" in window) ||
                !("Notification" in window)
            ) {

                console.log(
                    "Push notifications are not supported."
                );

                return;
            }


            try {

                const registration =
                    await navigator.serviceWorker.register(
                        "/sw.js"
                    );


                let permission =
                    Notification.permission;


                if (
                    permission ===
                    "default"
                ) {

                    permission =
                        await Notification.requestPermission();

                }


                if (
                    permission !==
                    "granted"
                ) {

                    console.log(
                        "Notification permission was not granted."
                    );

                    return;
                }


                let subscription =
                    await registration
                        .pushManager
                        .getSubscription();


                if (!subscription) {

                    subscription =
                        await registration
                            .pushManager
                            .subscribe({

                                userVisibleOnly:
                                    true,

                                applicationServerKey:
                                    urlBase64ToUint8Array(

                                    )

                            });

                }


                await fetch(

        /* =========================

        ========================= */

        function runLoadingScreen(
            callback
        ) {

            const loadingScreen =
                document.getElementById(
                    "loadingScreen"
                );


            const progressBar =
                document.getElementById(
                    "progressBar"
                );


            const loadingText =
                document.getElementById(
                    "loadingText"
                );


            const messages = [

                "Starting up...",

                "Preparing dashboard...",

                "Loading your account...",

                "Almost ready..."

            ];


            let progress =
                0;


            loadingScreen.style.display =
                "flex";


            loadingScreen.style.opacity =
                "1";


            const interval =
                setInterval(() => {

                    progress +=
                        5;


                    progressBar.style.width =
                        progress +
                        "%";


                    const index =
                        Math.min(
                            Math.floor(
                                progress /
                                25
                            ),
                            messages.length -
                            1
                        );


                    loadingText.textContent =
                        messages[index];


                    if (
                        progress >=
                        100
                    ) {

                        clearInterval(
                            interval
                        );


                        setTimeout(() => {

                            loadingScreen.style.opacity =
                                "0";


                            setTimeout(() => {

                                loadingScreen.style.display =
                                    "none";


                                if (
                                    callback
                                ) {

                                    callback();

                                }

                            }, 600);

                        }, 250);

                    }

                }, 70);

        }


        /* =========================

        function getGreeting(
            name
        ) {

            const hour =
                new Date()
                    .getHours();


            if (
                hour >= 5 &&
                hour < 12
            ) {

                return (
                    "Good morning " +
                    name
                );

            }


            if (
                hour >= 12 &&
                hour < 18
            ) {

                return (
                    "Good afternoon " +
                    name
                );

            }


            if (
                hour >= 18 &&
                hour < 22
            ) {

                return (
                    "Good evening " +
                    name
                );

            }


            return (
                "Good night " +
                name
            );

        }

        function createSystemNotification() {

        async function loadNotifications() {

            if (!currentUser) return;


            try {

                const response =
                    await fetch(
                        "/api/data?username=" +
                        encodeURIComponent(
                            currentUser.username
                        )
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Failed to load notifications"
                    );

                }


                sharedNotifications =
                    Array.isArray(
                        data.notifications
                    )
                        ? data.notifications
                        : [];


                renderNotifications();

                updateUnreadCount();

            }

            catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );

            }

        }


        function getReadNotifications() {

            return JSON.parse(
                localStorage.getItem(
                    "readNotifications:" +
                    currentUser.username
                ) ||
                "[]"
            );

        }


        function isRead(id) {

            return getReadNotifications()
                .includes(
                    String(id)
                );

        }


        function markNotificationRead(
            id
        ) {

            const read =
                getReadNotifications();


            const stringId =
                String(id);


            if (
                !read.includes(
                    stringId
                )
            ) {

                read.push(
                    stringId
                );

            }


            localStorage.setItem(
                "readNotifications:" +
                currentUser.username,
                JSON.stringify(
                    read
                )
            );


            renderNotifications();

            updateUnreadCount();

        }


        function updateUnreadCount() {

            const notifications =
                getVisibleNotifications();


            const unread =
                notifications.filter(
                    notification =>
                        !isRead(
                            notification.id
                        )
                ).length;


            const badge =
                document.getElementById(
                    "unreadBadge"
                );


            if (
                unread > 0
            ) {

                badge.textContent =
                    unread > 99
                        ? "99+"
                        : unread;


                badge.style.display =
                    "flex";

            }

            else {

                badge.style.display =
                    "none";

            }

        }


        /* =========================
           VISIBLE NOTIFICATIONS
        ========================= */

        function getVisibleNotifications() {

            if (!currentUser) {

                return [];

            }


            const now =
                Date.now();


            const lifetime =
                24 *
                60 *
                60 *
                1000;


            return sharedNotifications
                .filter(
                    notification => {

                        if (
                            !notification.createdAt
                        ) {

                            return false;

                        }


                        const age =
                            now -
                            new Date(
                                notification.createdAt
                            ).getTime();


                        if (
                            age >
                            lifetime
                        ) {

                            return false;

                        }


                        /* =========================
                           LANDON
                        ========================= */

                        if (
                            currentUser.username ===
                            "landon"
                        ) {

                            return (
                                notification.recipient ===
                                "landon"
                            );

                        }


                        /* =========================
                           MAMA
                        ========================= */

                        if (
                            currentUser.username ===
                            "mama"
                        ) {

                            return (
                                notification.recipient ===
                                    "mama" ||

                                (
                                    notification.recipient ===
                                        "landon" &&

                                    notification.type ===
                                        "food"
                                )
                            );

                        }


                        /* =========================
                           SYSTEM
                        ========================= */

                        if (
                            currentUser.username ===
                            "system"
                        ) {

                            return true;

                        }


                        return false;

                    }
                );

        }


        /* =========================
           RENDER ALL
        ========================= */

        function renderNotifications() {

            const container =
                document.getElementById(
                    "notifications"
                );


            if (!container) return;


            const notifications =
                getVisibleNotifications();


            if (
                notifications.length ===
                0
            ) {

                const language =
                    getLanguage();


                container.innerHTML = `

                    <div class="emptyState">

                        ${
                            translations[
                                language
                            ].empty
                        }

                    </div>

                `;


                return;

            }


            container.innerHTML =
                notifications
                    .sort(
                        (a, b) =>
                            new Date(
                                b.createdAt
                            ) -
                            new Date(
                                a.createdAt
                            )
                    )
                    .map(
                        notification =>
                            renderNotification(
                                notification
                            )
                    )
                    .join("");


            updateUnreadCount();

        }

                        ? ""
                        : "unread"
                }">


                    <div
                        class="notificationTop"
                    >

                        <div>

                            <div
                                class="notificationTitle"
                            >
                                ${escapeHTML(
                                    title
                                )}
                            </div>


                            <div
                                class="notificationSender"
                            >
                                ${escapeHTML(
                                    sender
                                )}
                            </div>

                        </div>

                    </div>


                    <div
                        class="notificationMessage"
                    >
                        ${message}
                    </div>


                    <div
                        class="notificationTime"
                    >
                        ${date.toLocaleString()}
                    </div>


                    ${actions}


                    ${
                        !read
                            ? `

                                <div
                                    class="notificationActions"
                                >

                                    <button
                                        class="readButton"
                                        onclick="markNotificationRead(
                                            '${escapeJS(
                                                notification.id
                                            )}'
                                        )"
                                    >
                                        Mark as read
                                    </button>

                                </div>

                            `
                            : ""
                    }

                </div>

            `;

        }


        /* =========================
           FOOD ANSWER
        ========================= */

        async function answerFood(
            notificationId,
            answer
        ) {

            if (
                answer ===
                "Yes"
            ) {

                const area =
                    document.getElementById(
                        "foodArea-" +
                        notificationId
                    );


                if (area) {

                    area.style.display =
                        "block";

                }


                const input =
                    document.getElementById(
                        "foodInput-" +
                        notificationId
                    );


                if (input) {

                    input.focus();

                }


                return;

            }


            await saveAnswer(
                notificationId,
                "No",
                null
            );

        }


        async function submitFood(
            notificationId
        ) {

            const input =
                document.getElementById(
                    "foodInput-" +
                    notificationId
                );


            if (!input) return;


            const food =
                input.value.trim();


            if (!food) {

                input.focus();

                return;

            }


            await saveAnswer(
                notificationId,
                "Yes",
                food
            );

        }


        async function saveAnswer(
            notificationId,
            answer,
            food
        ) {

            try {

                const response =
                    await fetch(
                        "/api/answer",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:
                                        currentUser.username,

                                    notificationId,

                                    answer,

                                    food

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Failed to save answer"
                    );

                }


                await loadNotifications();

            }

            catch (error) {

                console.error(
                    "Answer error:",
                    error
                );


                alert(
                    "Could not save your answer. Please try again."
                );

            }

        }


        /* =========================
           INBOX
        ========================= */

        function openInbox() {

            loadNotifications();


            document.getElementById(
                "inboxModal"
            ).style.display =
                "flex";

        }


        function closeInbox() {

            document.getElementById(
                "inboxModal"
            ).style.display =
                "none";

        }


        /* =========================
           SYSTEM TESTER
        ========================= */

        function openSystemTester() {

            if (
                !currentUser ||
                currentUser.username !==
                "system"
            ) {

                return;

            }


            const language =
                getLanguage();


            const t =
                translations[language] ||
                translations.en;


            const container =
                document.getElementById(
                    "notifications"
                );


            document.getElementById(
                "inboxModal"
            ).style.display =
                "flex";


            container.innerHTML = `

                <div class="notification">

                    <div
                        class="notificationTitle"
                    >
                        ${t.systemTitle}
                    </div>


                    <div
                        class="notificationSender"
                    >
                        System
                    </div>


                    <div
                        class="notificationMessage"
                        style="margin-top: 10px;"
                    >
                        Test the breakfast,
                        lunch, or dinner
                        notification immediately.
                    </div>


                    <div
                        class="notificationActions"
                    >

                        <button
                            class="testButton"
                            onclick="testNotification(
                                'breakfast'
                            )"
                        >
                            Test Breakfast
                        </button>


                        <button
                            class="testButton"
                            onclick="testNotification(
                                'lunch'
                            )"
                        >
                            Test Lunch
                        </button>


                        <button
                            class="testButton"
                            onclick="testNotification(
                                'dinner'
                            )"
                        >
                            Test Dinner
                        </button>

                    </div>

                </div>

            `;

        }


        async function testNotification(
            type
        ) {

            if (
                !currentUser ||
                currentUser.username !==
                "system"
            ) {

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/notifications?test=" +
                        encodeURIComponent(
                            type
                        )
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Test failed"
                    );

                }


                alert(
                    type +
                    " notification sent."
                );


                await loadNotifications();

            }

            catch (error) {

                console.error(
                    "Test notification error:",
                    error
                );


                alert(
                    "Could not send test notification."
                );

            }

        }


        /* =========================
           AI ASSISTANT
        ========================= */

        function openAI() {

            document.getElementById(
                "aiModal"
            ).style.display =
                "flex";


            document.getElementById(
                "chatInput"
            ).focus();


            renderChat();

        }


        function closeAI() {

            document.getElementById(
                "aiModal"
            ).style.display =
                "none";

        }


        function renderChat() {

            const container =
                document.getElementById(
                    "chatMessages"
                );


            if (
                chatMessages.length ===
                0
            ) {

                container.innerHTML = `

                    <div
                        class="chatMessage assistant"
                    >

                        <div>

                            <div
                                class="chatName"
                            >
                                AI Assistant
                            </div>


                            <div
                                class="chatBubble"
                            >
                                Hi! I'm your AI Assistant. Ask me anything.
                            </div>

                        </div>

                    </div>

                `;


                return;

            }


            container.innerHTML =
                chatMessages
                    .map(
                        message => {

                            const isUser =
                                message.role ===
                                "user";


                            return `

                                <div
                                    class="chatMessage ${
                                        isUser
                                            ? "user"
                                            : "assistant"
                                    }"
                                >

                                    <div>

                                        ${
                                            !isUser
                                                ? `

                                                    <div
                                                        class="chatName"
                                                    >
                                                        AI Assistant
                                                    </div>

                                                `
                                                : ""
                                        }


                                        <div
                                            class="chatBubble"
                                        >
                                            ${escapeHTML(
                                                message.content
                                            )}
                                        </div>

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");


            container.scrollTop =
                container.scrollHeight;

        }


        async function sendMessage() {

            const input =
                document.getElementById(
                    "chatInput"
                );


            const sendButton =
                document.getElementById(
                    "sendButton"
                );


            const typing =
                document.getElementById(
                    "typingIndicator"
                );


            const message =
                input.value.trim();


            if (!message) return;


            chatMessages.push({

                role:
                    "user",

                content:
                    message

            });


            input.value =
                "";


            renderChat();


            sendButton.disabled =
                true;


            typing.style.display =
                "block";


            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    messages:
                                        chatMessages

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "AI request failed."
                    );

                }


                chatMessages.push({

                    role:
                        "assistant",

                    content:
                        data.reply ||
                        "I couldn't generate a response."

                });

            }

            catch (error) {

                console.error(
                    error
                );


                chatMessages.push({

                    role:
                        "assistant",

                    content:
                        "Sorry, something went wrong while contacting the AI."

                });

            }

            finally {

                typing.style.display =
                    "none";


                sendButton.disabled =
                    false;


                renderChat();


                input.focus();

            }

        }


        /* =========================
           ENTER TO SEND
        ========================= */

        document.getElementById(
            "chatInput"
        ).addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                        "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =========================
           MODAL CLOSE
        ========================= */

        function closeModalIfBackground(
            event,
            modalId
        ) {

            if (
                event.target.id ===
                modalId
            ) {

                document.getElementById(
                    modalId
                ).style.display =
                    "none";

            }

        }


        /* =========================
           HTML SAFETY
        ========================= */

        function escapeHTML(
            text
        ) {

            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeJS(
            text
        ) {

            return String(text)

                .replace(
                    /\\/g,
                    "\\\\"
                )

                .replace(
                    /'/g,
                    "\\'"
                );

        }


        /* =========================
           AUTOMATIC SYNC
        ========================= */

        setInterval(
            () => {

                if (!currentUser) return;

                loadNotifications();

            },
            15000
        );


        /* =========================
           START APPLICATION
        ========================= */

        function startApplication() {

            runLoadingScreen(
                () => {

                    const savedUser =
                        localStorage.getItem(
                            "loggedInUser"
                        );


                    if (
                        savedUser &&
                        accounts[savedUser]
                    ) {

                        currentUser = {

                            username:
                                savedUser,

                            displayName:
                                accounts[
                                    savedUser
                                ].displayName

                        };


                        runLoadingScreen(
                            () => {

                                showDashboard();

                            }
                        );

                    }

                    else {

                        document.getElementById(
                            "loginPage"
                        ).style.display =
                            "flex";

                    }

                }
            );

        }


        startApplication();

    </script>
